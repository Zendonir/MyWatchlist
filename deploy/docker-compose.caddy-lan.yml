# LAN-only HTTPS overlay: adds Caddy in front of MyWatchlist using a
# self-signed local CA (Caddy's "tls internal") instead of a public domain +
# Let's Encrypt. No DOMAIN, no port-forwarding, no public DNS needed - just
# for reaching the app securely over your home network by IP.
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.caddy-lan.yml up -d
#
# Then open: https://<truenas-ip>  (port 443 - no :3000 needed anymore)
# The browser will warn once that the certificate isn't trusted - that's
# expected for a self-signed local CA. Accept it ("Advanced -> proceed") and
# it won't ask again for that browser/device.

services:
  caddy:
    image: caddy:2-alpine
    container_name: mywatchlist-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy_lan_data:/data
      - caddy_lan_config:/config
    networks:
      - mywatchlist_net
    depends_on:
      - mywatchlist

volumes:
  caddy_lan_data:
  caddy_lan_config:
