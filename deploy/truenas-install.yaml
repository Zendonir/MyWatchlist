# MyWatchlist - standalone install file for TrueNAS SCALE.
#
# Use this with Apps -> Discover Apps -> Custom App -> "Install via YAML"
# (or `docker compose -f deploy/truenas-install.yaml up -d` on any Docker
# host). Unlike docker-compose.yml in the repo root, this doesn't build the
# image locally - it pulls the prebuilt image published by the GitHub
# Actions release workflow, so no source checkout is needed.
#
# Before pasting this in:
#   1. Fill in SESSION_SECRET, APP_EMAIL, APP_PASSWORD and TMDB_API_KEY
#      below (see the main README for where to get a TMDB key and how to
#      generate SESSION_SECRET).
#   2. Make sure the ghcr.io/zendonir/mywatchlist package is set to "Public"
#      visibility on GitHub (Profile -> Packages), otherwise pulling the
#      image anonymously will fail with "denied".
#   3. Kodi/TVDB variables are optional - leave them empty to disable sync.
#
# This exposes port 3000 directly on the host for simplicity. For external
# access, put it behind a VPN, Cloudflare Tunnel, or reverse proxy with TLS
# instead of forwarding 3000 straight to the internet - see the README
# "Externer Zugriff & Sicherheit" section.

services:
  mywatchlist:
    image: ghcr.io/zendonir/mywatchlist:latest
    container_name: mywatchlist
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/mywatchlist.db"
      TRUST_PROXY: "1"

      # Required - generate with: openssl rand -base64 48
      SESSION_SECRET: "REPLACE_ME_RANDOM_STRING"

      # Required - creates the first admin account on initial startup only.
      # APP_EMAIL doubles as your login - it doesn't need to be a real,
      # working address (only "forgot password"/notifications need that,
      # both optional - see APP_URL below and README "Email (optional)").
      APP_EMAIL: "REPLACE_ME_EMAIL"
      APP_NAME: "Admin"
      APP_PASSWORD: "REPLACE_ME_STRONG_PASSWORD"

      # Required for search/metadata - https://www.themoviedb.org/settings/api
      TMDB_API_KEY: "REPLACE_ME_TMDB_API_KEY"
      TMDB_ACCESS_TOKEN: ""

      # Optional - https://thetvdb.com/dashboard/account/apikey
      TVDB_API_KEY: ""

      # Optional - fill in to enable automatic Kodi watched-status sync.
      # KODI_DB_NAME_PREFIX is a prefix only (e.g. "MyVideos") - the app
      # finds every "<prefix><number>" database on the server and always
      # uses the one with the highest number, i.e. Kodi's current schema.
      KODI_DB_HOST: ""
      KODI_DB_PORT: "3306"
      KODI_DB_USER: ""
      KODI_DB_PASSWORD: ""
      KODI_DB_NAME_PREFIX: "MyVideos"
      KODI_SYNC_CRON: "0 3 * * *"

      # Optional - only needed for "Passwort vergessen" email links. The
      # actual SMTP server/credentials are entered later from
      # Settings -> E-Mail-Versand (SMTP), not here - see README
      # "Email (optional)". E.g. http://192.168.1.2:3000
      APP_URL: ""
    volumes:
      - mywatchlist_data:/app/data

volumes:
  mywatchlist_data:
