name: Release

# Builds the Docker image and publishes it to GitHub Container Registry,
# then creates a GitHub Release with the compose/YAML files attached, any
# time a tag like "v1.0.0" is pushed - or on demand via "Run workflow" in
# the Actions tab (useful before this branch has a tag of its own).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (no leading v)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/zendonir/mywatchlist:${{ steps.version.outputs.version }}
            ghcr.io/zendonir/mywatchlist:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            deploy/truenas-install.yaml
            deploy/truenas-install-https.yaml
            docker-compose.yml
            deploy/docker-compose.caddy.yml
            deploy/Caddyfile
            deploy/docker-compose.caddy-lan.yml
            deploy/Caddyfile.lan
            .env.example
