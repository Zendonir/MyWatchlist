name: Release

# Builds the Docker image and publishes it to GitHub Container Registry,
# then creates a GitHub Release with the compose/YAML files attached, any
# time a tag like "v1.0.0" is pushed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/zendonir/mywatchlist:${{ steps.version.outputs.version }}
            ghcr.io/zendonir/mywatchlist:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            deploy/truenas-install.yaml
            docker-compose.yml
            deploy/docker-compose.caddy.yml
            deploy/Caddyfile
            .env.example
